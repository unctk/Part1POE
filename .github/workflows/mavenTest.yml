
name: Java CI with Maven

# Runs the test suite automatically whenever code is pushed or a pull
# request is opened against the main branch, so every change is tested
# before it is merged in.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with Maven
        run: mvn --batch-mode --update-snapshots test
